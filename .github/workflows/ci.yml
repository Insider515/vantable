# CI for the vantable package: syntax + types + DOM/export tests for the
# library, build + unit tests for the Go export binary. The DOM tests include
# a few that drive headless Chrome, so the browser is located up front and a
# missing one fails the run instead of skipping them.
name: ci

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: locate Chrome for the browser tests
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version
      - run: npm run lint
      - run: npm run typecheck
      - name: dist is in sync with src
        run: cmp src/vantable.js dist/vantable.umd.js
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: build the export binary (needed by the end-to-end test)
        run: npm run build:go
      - run: npm run test:coverage

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: go vet / test / build
        working-directory: tools/vtexport
        run: |
          gofmt -l . | tee /dev/stderr | (! read)
          go vet ./...
          go test -cover ./...
          GOOS=linux GOARCH=amd64 go build -o vtexport .
